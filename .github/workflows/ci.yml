# CI gates (SEC-040, SEC-041, A11Y-002).
#
# The point of this file is that a pull request cannot merge with a failing
# security control. Every job here is a gate, not a report.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_not_a_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scanning needs history, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Lockfile-exact install. `npm ci` fails if package.json and the lockfile
      # disagree, which is what makes the dependency set reproducible.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency vulnerabilities (SEC-040)
        run: npm run audit:ci

      - name: Build frontend
        run: npm run build

      - name: Test — authorisation, security, invariants, accessibility
        env:
          TEST_ADMIN_DATABASE_URL: postgres://postgres:ci_only_not_a_secret@127.0.0.1:5432/postgres
        run: npm test

      - name: SBOM (SEC-040)
        run: npm run sbom

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Includes the security-extended pack; the default set alone misses
          # several injection sinks.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (SEC-041)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Reminder gate. `budget-data.js` is the real FY2026 workbook extract and is
  # classified Confidential (PRIV-010). Seeds must stay synthetic; this fails
  # the build if application code starts importing it.
  confidential-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse an import of the real workbook extract
        run: |
          # Comment and string-literal lines are stripped before matching.
          # The previous version of this gate matched any occurrence of the
          # name, which meant the comments *explaining* the rule tripped it —
          # and a gate that fails on its own documentation is a gate someone
          # deletes. What must never appear is a code path that reads the file.
          hits=$(grep -rn "budget-data" packages/ test/ \
                   --include='*.ts' --include='*.tsx' \
                 | grep -vE ':[[:space:]]*(//|\*|/\*)' \
                 | grep -E "(import|require|readFile|readFileSync|createRequire|from)[^;]*budget-data" \
                 || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Application code must not read design/budget-data.js (PRIV-010, CMP-104)."
            echo "Only tools/anonymise.ts may read it, and it is an offline tool."
            exit 1
          fi
          echo "No code path reads the confidential workbook extract."
